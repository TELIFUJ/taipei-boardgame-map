<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta property="og:title" content="台北桌遊地圖">
  <meta property="og:description" content="探索台北市的桌遊店與捷運網絡">
  <meta property="og:type" content="website">
  <meta property="og:image" content="og_image.png">
  <title>台北桌遊地圖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/font-awesome/4.1.0/css/font-awesome.min.css">
  <link href="css/ol.css" rel="stylesheet">
  <link href="css/ol3-sidebar.min.css" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    .ol-popup {
      position: absolute;
      background: white;
      border-radius: 4px;
      border: 1px solid #ccc;
      padding: 10px;
      bottom: 12px;
      left: -50px;
      min-width: 200px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      z-index: 100;
    }

    .sidebar-pane {
      background: #f8f9fa;
      padding: 10px;
    }

    .sidebar-tabs ul li:first-child {
      background-color: #e9ecef;
    }
  </style>
</head>

<body>
  <div id="sidebar" class="sidebar">
    <div class="sidebar-tabs">
      <ul role="tablist">
        <li class="active"><a href="#info" role="tab"><i class="fa fa-info-circle"></i></a></li>
        <li><a href="https://github.com/TELIFUJ/taipei-boardgame-map" target="_blank"><i class="fa fa-github"></i></a></li>
      </ul>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-pane active" id="info">
        <h1 class="sidebar-header">店家資訊 <span class="sidebar-close"><i class="fa fa-caret-left"></i></span></h1>

        <!-- --- 篩選器 --- -->
        <div id="filters" class="p-2">
          <select id="districtSel" class="form-select mb-2">
            <option value="">全部行政區</option>
            <option>中正區</option><option>大同區</option><option>中山區</option>
            <option>松山區</option><option>大安區</option><option>萬華區</option>
            <option>信義區</option><option>士林區</option><option>北投區</option>
            <option>內湖區</option><option>南港區</option><option>文山區</option>
          </select>

          <label class="form-label">最高價位 (NT$/hr)</label>
          <input type="range" id="priceRange" class="form-range" min="50" max="300" value="300">
          <span id="priceLabel" class="badge bg-primary">300</span>

          <hr class="my-2">
          <div class="mb-2">服務：</div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="teaching" id="svcTeach">
            <label class="form-check-label" for="svcTeach">教學</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="drinkUnlimited" id="svcDrink">
            <label class="form-check-label" for="svcDrink">飲料暢飲</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="usedGames" id="svcUsed">
            <label class="form-check-label" for="svcUsed">二手桌遊</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="reservation" id="svcResv">
            <label class="form-check-label" for="svcResv">預約包場</label>
          </div>

          <div id="resultCount" class="mt-2 text-muted small">目前顯示 0 間桌遊店</div>
        </div>
        <!-- --- /篩選器 --- -->

        <div id="infoBox">請點選地圖上的桌遊店</div>
      </div>
    </div>
  </div>

  <div id="map" class="sidebar-map"></div>

  <!-- ✅ Popup 元素 -->
  <div id="popup" class="ol-popup">
    <div id="popup-content"></div>
  </div>

  <div style="position: fixed; bottom: 0; left: 0;">
    <a href="https://facebook.com/k.olc.tw/" target="_blank" class="btn btn-sm alert-primary">製作人：謀 & 江明宗</a>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ol.js"></script>
  <script src="js/ol5-sidebar.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
